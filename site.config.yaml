name: Saswata Nandi
role: Postdoctoral Researcher · Hydrology          # TODO(Saswata): current title
affiliation:
  name: "University of California, Merced"          # TODO(Saswata): current institution (empty = hidden)
  url: "https://ecohydrology.ucmerced.edu/"                                           # TODO(Saswata): institution / lab URL
location: California, USA                           # TODO(Saswata): confirm
email: withsaswata@gmail.com                        # TODO(Saswata): confirm (shown obfuscated, never as plain text in HTML)

# Short bio (Markdown). Shown on the home page and used for the meta description.
bio: |
  I am a hydrologist working at the interface of **hydrology, land-surface modelling, remote sensing and climate impacts**.
  My research focuses on how forests, fire and a changing climate reshape our water.
  I did my PhD in Water Resources Engineering at IIT Bombay and I support open, reproducible science:
  I created and maintain [IMDLIB](/software/), an open-source Python library for Indian gridded weather data.

# One-line description used in search results / social cards (≤ 160 characters).
description: Hydrologist working on land-surface modelling, forests & fire, forecasting and climate impacts. Creator of the open-source IMDLIB Python library.

