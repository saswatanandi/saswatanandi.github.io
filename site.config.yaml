# Short bio (Markdown). Shown on the home page and used for the meta description.
bio: |
  I am a scientist working on **hydrology and water resources management**.
  My work connects a physical understanding of the water cycle with the decisions made about water, using land-surface models, satellite observations and climate data.
  My research focuses on how forests, fire and a changing climate reshape our water.
  I received my PhD in Water Resources Engineering from IIT Bombay.
  I also develop open-source tools for hydroclimate data, including [IMDLIB](/software/imdlib/), a Python library for India Meteorological Department gridded data, used widely in hydroclimate research in India.

# One-line description used in search results / social cards (≤ 160 characters).
description: Hydrologist working on land-surface modelling, forests & fire, forecasting and climate impacts. Creator of the open-source IMDLIB Python library.

