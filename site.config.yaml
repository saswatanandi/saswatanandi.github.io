# Short bio (Markdown). Shown on the home page and used for the meta description.
bio: |
  I am a hydrologist working at the interface of **land-surface modelling, remote sensing and climate**.
  My research asks how forests, fire and a changing climate reshape the water balance — from
  evapotranspiration in the Sierra Nevada to floods, droughts and streamflow forecasts in Indian river basins.
  I did my PhD in Water Resources Engineering at IIT Bombay and I care about open, reproducible science:
  I created and maintain [IMDLIB](/software/), an open-source Python library for Indian gridded weather data.

# One-line description used in search results / social cards (≤ 160 characters).
description: Hydrologist working on land-surface modelling, forests & fire, forecasting and climate impacts. Creator of the open-source IMDLIB Python library.

