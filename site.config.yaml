# Publications page (/publications/ and each paper's page).
# Badges load from Altmetric / Dimensions only for papers with a DOI; empty ones hide themselves.
# Set altmetric/dimensions to false to switch a badge off everywhere.
# in_list: true also shows them in the /publications/ list (off = only on each paper's own page).
