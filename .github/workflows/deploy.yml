# Build the site and publish it to GitHub Pages on every push to main.
# Repo settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CV PDF (public/cv.pdf) from cv.yaml + site.config.yaml + publications.bib.
      # Built before the site so the build copies it to /cv.pdf.
      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.2

      - name: Build CV PDF
        run: npm run cv:pdf

      # Titles/authors/venues/years that scripts/reading-meta.mjs looked up from Crossref for
      # DOI-only entries in src/data/reading.yaml. Keeping the file between builds means each DOI is
      # looked up once. A new key every run saves the updated file; restore-keys loads the latest one.
      - name: Cache reading-list lookups
        uses: actions/cache@v4
        with:
          path: .cache/reading-meta.json
          key: reading-meta-${{ github.run_id }}
          restore-keys: reading-meta-

      # npm run build = notebook posts → Markdown (scripts/notebooks.mjs, saved outputs, nothing
      # executed), reading-list lookups (scripts/reading-meta.mjs), then astro build, then the
      # Pagefind search index (dist/pagefind/).
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
