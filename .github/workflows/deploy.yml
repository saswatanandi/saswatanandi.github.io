# Build the site and publish it to GitHub Pages on every push to main.
# Repo settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Phase 3: Jupyter notebooks → Markdown (stored outputs, not executed) ──
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - run: pip install nbconvert
      # - run: python scripts/convert_notebooks.py

      # ── Phase 2: CV PDF from cv.yaml + publications.bib ──
      # - uses: typst-community/setup-typst@v4
      # - run: typst compile cv/cv.typ public/cv.pdf

      - name: Build
        run: npm run build

      # ── Phase 3: search index ──
      # - run: npx pagefind --site dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
