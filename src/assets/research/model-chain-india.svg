<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" class="mci"><style>
.mci{--mci-ink:var(--color-text,#1b2a33);--mci-acc:var(--color-accent,#0f6e56);--mci-acc2:var(--color-accent-2,#1d9e75);--mci-acc3:var(--color-accent-3,#5dcaa5);--mci-warm:var(--color-warm,#ba7517);--mci-muted:var(--color-text-muted,#45565f);--mci-faint:var(--color-text-faint,#5d6d76);--mci-surf:var(--color-surface,#fff);--mci-surf2:var(--color-surface-2,#eef3f4)}
.mci-land{fill:url(#mci-g)}.mci-g1{stop-color:color-mix(in srgb,var(--mci-ink) 12%,transparent)}.mci-g2{stop-color:color-mix(in srgb,var(--mci-ink) 0%,transparent)}
.mci-edge{fill:none;stroke:color-mix(in srgb,var(--mci-ink) 45%,transparent);stroke-width:1.5;stroke-linejoin:round}
.mci-hair{fill:none;stroke:color-mix(in srgb,var(--mci-ink) 22%,transparent);stroke-width:1.2;stroke-dasharray:2 5;stroke-linecap:round}
.mci-tree{fill:var(--mci-acc)}.mci-tree2{fill:var(--mci-acc2);opacity:.55}
.mci-shrub{fill:var(--mci-acc2);opacity:.8}
.mci-water{fill:var(--mci-acc3);opacity:.75}
.mci-cloud{fill:var(--mci-surf);stroke:color-mix(in srgb,var(--mci-ink) 40%,transparent);stroke-width:1.5}
.mci-rain{stroke:var(--mci-acc2);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:7 6}
.mci-snow{fill:none;stroke:var(--mci-faint);stroke-width:1.4;stroke-linecap:round}
.mci-et{fill:none;stroke:var(--mci-acc);stroke-width:3.2;stroke-linecap:round}
.mci-et-s{fill:none;stroke:var(--mci-acc);stroke-width:1.8;stroke-linecap:round}
.mci-head{fill:var(--mci-acc)}
.mci-flow{fill:none;stroke:var(--mci-acc2);stroke-width:2.6;stroke-linecap:round}
.mci-flowh{fill:var(--mci-acc2)}
.mci-dam{fill:var(--mci-muted)}
.mci-sun{fill:var(--mci-warm)}.mci-ray{stroke:var(--mci-warm);stroke-width:2;stroke-linecap:round}

.mci-l1{fill:var(--mci-acc3);opacity:.12}.mci-l2{fill:var(--mci-acc3);opacity:.22}.mci-l3{fill:var(--mci-acc3);opacity:.34}
.mci-lay{fill:none;stroke:color-mix(in srgb,var(--mci-ink) 26%,transparent);stroke-width:1.1;stroke-dasharray:3 4}
.mci-cut{fill:none;stroke:color-mix(in srgb,var(--mci-ink) 45%,transparent);stroke-width:1.5}
.mci-flood{fill:var(--mci-acc3);opacity:.5}
.mci-floodl{fill:none;stroke:var(--mci-acc2);stroke-width:1.5;stroke-dasharray:5 4}
.mci-house{fill:var(--mci-muted)}
.mci-bf{fill:none;stroke:var(--mci-acc2);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1 6}
.mci-zone{fill:none;stroke:color-mix(in srgb,var(--mci-ink) 18%,transparent);stroke-width:1;stroke-dasharray:2 4}
.mci-tn{fill:var(--color-accent,#0f6e56)}
.mci-tnt{font:700 12px var(--font-body,Inter,system-ui,sans-serif);fill:var(--color-on-accent,#fff)}
.mci-tt{font:500 16px var(--font-body,Inter,system-ui,sans-serif);fill:var(--color-text-muted,#45565f);paint-order:stroke;stroke:var(--color-surface,#fff);stroke-width:6px;stroke-linejoin:round}
.mci-tt tspan.b{font-weight:700;fill:var(--color-text,#1b2a33)}</style><defs><linearGradient id="mci-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="mci-g1"/><stop offset="1" class="mci-g2"/></linearGradient></defs><path class="mci-land" d="M0,114.9 4,115.9 8,117.1 12,118.3 16,119.7 20,121 24,122.4 28,123.7 32,125.1 36,126.4 40,127.7 44,129 48,130.3 52,131.5 56,132.8 60,134 64,135.1 68,136.3 72,137.4 76,138.5 80,139.6 84,140.7 88,141.7 92,142.8 96,143.8 100,144.9 104,146 108,147.1 112,148.2 116,149.4 120,150.5 124,151.8 128,153 132,154.3 136,155.7 140,157.1 144,158.6 148,160.2 152,161.8 156,163.5 160,165.2 164,167 168,169 172,170.9 176,173 180,175.1 184,177.3 188,179.6 192,181.9 196,184.3 200,186.7 204,189.2 208,191.8 212,194.4 216,197 220,199.7 224,202.4 228,205.1 232,207.9 236,210.6 240,213.4 244,216.1 248,218.9 252,221.6 256,224.3 260,227 264,229.7 268,232.3 272,234.9 276,237.4 280,239.9 288,245.9 300,259.9 336,269.9 376,269.9 404,259.9 418,245.9 418,233.9 430,233.9 440,290 520,292 566,294 572,310 584,314 596,310 602,294 660,292 690,276 720,266 L720,360 L0,360 Z"/><path class="mci-l1" d="M0,114.9 4,115.9 8,117.1 12,118.3 16,119.7 20,121 24,122.4 28,123.7 32,125.1 36,126.4 40,127.7 44,129 48,130.3 52,131.5 56,132.8 60,134 64,135.1 68,136.3 72,137.4 76,138.5 80,139.6 84,140.7 88,141.7 92,142.8 96,143.8 100,144.9 104,146 108,147.1 112,148.2 116,149.4 120,150.5 124,151.8 128,153 132,154.3 136,155.7 140,157.1 144,158.6 148,160.2 152,161.8 156,163.5 160,165.2 164,167 168,169 172,170.9 176,173 180,175.1 184,177.3 188,179.6 192,181.9 196,184.3 200,186.7 204,189.2 208,191.8 212,194.4 216,197 220,199.7 224,202.4 228,205.1 232,207.9 236,210.6 240,213.4 244,216.1 248,218.9 252,221.6 256,224.3 260,227 264,229.7 268,232.3 272,234.9 276,237.4 280,239.9 L280,253.9 276,251.4 272,248.9 268,246.3 264,243.7 260,241 256,238.3 252,235.6 248,232.9 244,230.1 240,227.4 236,224.6 232,221.9 228,219.1 224,216.4 220,213.7 216,211 212,208.4 208,205.8 204,203.2 200,200.7 196,198.3 192,1