<style>
.ce{--ce-ink:var(--color-text,#1b2a33);--ce-acc:var(--color-accent,#0f6e56);--ce-acc2:var(--color-accent-2,#1d9e75);--ce-acc3:var(--color-accent-3,#5dcaa5);--ce-warm:var(--color-warm,#ba7517);--ce-warmt:var(--color-warm-text,#8a5510);--ce-muted:var(--color-text-muted,#45565f);--ce-faint:var(--color-text-faint,#5d6d76)}
.ce-t{font-family:var(--font-body,Inter,system-ui,sans-serif);font-size:17px;font-weight:550;fill:var(--ce-ink)}
.ce-s{font-size:13.5px;font-weight:500;fill:var(--ce-muted)}
.ce-cap{font-size:13px;font-weight:650;letter-spacing:.12em;fill:var(--ce-faint)}
.ce-it{font-style:italic;font-weight:500;letter-spacing:.14em;font-size:13px;fill:var(--ce-faint)}
.ce-w{fill:var(--ce-warmt)}
.ce-grat{stroke:color-mix(in srgb,var(--ce-ink) 14%,transparent);stroke-width:1;stroke-dasharray:3 5;fill:none}
.ce-eq{stroke:color-mix(in srgb,var(--ce-ink) 30%,transparent);stroke-width:1.2;stroke-dasharray:8 5;fill:none}
.ce-land{fill:color-mix(in srgb,var(--ce-ink) 9%,transparent)}.ce-g1{stop-color:color-mix(in srgb,var(--ce-ink) 13%,transparent)}.ce-g2{stop-color:color-mix(in srgb,var(--ce-ink) 6%,transparent)}
.ce-coast{fill:none;stroke:color-mix(in srgb,var(--ce-ink) 50%,transparent);stroke-width:1.5;stroke-linejoin:round}
.ce-ar{fill:var(--ce-acc2);opacity:.28}
.ce-ar2{fill:var(--ce-acc2);opacity:.28}
.ce-str{fill:none;stroke:var(--ce-acc);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:14 9}
.ce-head{fill:var(--ce-acc)}
.ce-box{fill:var(--color-surface,#fff);stroke:color-mix(in srgb,var(--ce-ink) 30%,transparent);stroke-width:1.2}
.ce-wave{fill:none;stroke:var(--ce-acc);stroke-width:2;stroke-linecap:round}
.ce-mod{fill:none;stroke:var(--ce-muted);stroke-width:1.4;stroke-dasharray:3 4;stroke-linecap:round}
.ce-modh{fill:var(--ce-muted)}
.ce-rain{stroke:var(--ce-acc);stroke-width:1.8;stroke-linecap:round}
.ce-mtn{fill:none;stroke:color-mix(in srgb,var(--ce-ink) 45%,transparent);stroke-width:1.4;stroke-linejoin:round}
.ce-flood{fill:none;stroke:var(--ce-acc);stroke-width:2.2;stroke-linecap:round}
.ce-dry{fill:none;stroke:var(--ce-warm);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ce-sun{fill:var(--ce-warm)}
.ce-arrow{fill:none;stroke:var(--ce-muted);stroke-width:1.5}
</style>
