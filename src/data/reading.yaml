# ─────────────────────────────────────────────────────────────────────────────
#  Papers I have read, shown on /reading/ (newest `read` month first).
#  Copy the block in templates/reading-entry.yaml to the top of this list.
#
#  Fields:
#    title    paper title
#    authors  as you want them shown, e.g. "Beven, K." or "Smith, J., Lee, K. and Rao, P."
#    venue    journal (or book, preprint server)          optional
#    year     2024 (a number, no quotes)
#    doi      10.1029/2024WR012345 (no https://doi.org/)    optional
#    url      link used when there is no DOI                optional
#    read     month you read it: 2026-09
#    tags     [snow, remote-sensing]  (lowercase)
#    why      one line: why it is worth reading
#    note     file name of a longer note in src/content/reading/notes/ (without .md)   optional
#    draft    true = hidden on the live site
# ─────────────────────────────────────────────────────────────────────────────

# EXAMPLE (a draft, so it never appears on the live site). Replace it with a real paper.
