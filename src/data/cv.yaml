# ─────────────────────────────────────────────────────────────────────────────
#  cv.yaml — everything on /cv/ and in /cv.pdf except publications
#  (publications come from src/data/publications.bib automatically).
#
#  • Every section is optional. An empty list ([]) or a missing section is hidden.
#  • Dates: a year (2021) or year-month (2021-08). `end` can also be "present".
#    Leave a date as "" if you don't want to show it.
#  • `details` is one line of text, or a list of lines.
#  • `draft: true` hides an item without deleting it.
#  • Write items newest first; they are shown in the order you write them.
#  • To add an item, uncomment an example below (remove the leading "# ") and edit it.
#    A section name with nothing under it (e.g. `awards:`) is an empty section.
#  • A typo (wrong field name, bad date) stops the build with the field name in the message.
#
#  STATUS: placeholder. Only the facts below are known for sure; everything marked
#  TODO(Saswata) is waiting for the real CV.
# ─────────────────────────────────────────────────────────────────────────────

