software:
  - name: IMDLIB
    url: https://imdlib.readthedocs.io
    description: Open-source Python package for retrieval, processing, and spatiotemporal analysis of gridded India Meteorological Department (IMD) observational datasets. 251,000+ downloads; community-adopted across India-focused hydroclimate research.
  - name: prismdata
    url: https://prismdata.readthedocs.io
    description: Python package for programmatic access to PRISM climate data over the continental United States.
  - name: ARWIN
    url: https://arwin.edwateragency.org/
    description: Real-time hydroclimate decision-support dashboard for the Upper American River Basin, built and maintained for El Dorado County Water Agency.

