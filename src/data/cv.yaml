# ─────────────────────────────────────────────────────────────────────────────
#  cv.yaml — everything on /cv/ and in /cv.pdf except publications
#  (publications come from src/data/publications.bib automatically).
#
#  • Every section is optional. An empty list ([]) or a missing section is hidden.
#  • Dates: a year (2021) or year-month (2021-08). `end` can also be "present".
#    Leave a date as "" if you don't want to show it.
#  • `details` is one line of text, or a list of lines.
#  • `draft: true` hides an item without deleting it.
#  • Write items newest first; they are shown in the order you write them.
#  • To add an item, uncomment an example below (remove the leading "# ") and edit it.
#    A section name with nothing under it (e.g. `awards:`) is an empty section.
#  • A typo (wrong field name, bad date) stops the build with the field name in the message.
#
#  Source: the owner's CV (CV_SaswataNandi.pdf, 2026). Publications and conference
#  abstracts are NOT listed here: they come from src/data/publications.bib.
# ─────────────────────────────────────────────────────────────────────────────

# "Last updated" on the page and PDF. Empty = the date the site was built.
updated: ""

# Short profile paragraph at the top of the CV (**bold** allowed).
# Note: the numbers here are typed by hand; update them with the metrics in site.config.yaml.
summary: >-
  Hydrologist working on wildfire, forest, and hydroclimate extremes — and turning those models into
  tools agencies actually use. **22 papers** (h-index 11; 567 citations); lead developer of **IMDLIB**
  (**251,000+ downloads**) and **ARWIN** (decision-support dashboard for El Dorado County Water Agency).

pdf:
  paper: us-letter          # us-letter or a4
  publications: true        # include the publication list in the PDF

interests:
  - area: Forest & Wildfire Hydrology
    description: Effects of wildfire, forest management, and vegetation dynamics on water yield, evapotranspiration, and sediment fluxes
  - area: Hydroclimate Extremes & Risk
    description: Drivers and impacts of atmospheric rivers, drought, and floods under a changing climate
  - area: Hybrid Physics–ML Hydrology
    description: Coupling process-based hydrology with machine learning for forecasting and process understanding
  - area: Operational Hydrology
    description: Hydrologic observatories, real-time decision support tools, and open-source software for water agencies and the research community (ARWIN, IMDLIB)

positions:
  - title: Postdoctoral Research Scholar
    org: Sierra Nevada Research Institute, UC Merced
    location: CA, USA
    start: 2022
    end: present
    details:
      - ARWIN — real-time hydroclimate decision-support dashboard for El Dorado County Water Agency; two telemetry nodes (10 sites each); used by agency staff and basin stakeholders
      - American River Hydrologic Observatory (ARHO) — field instrumentation for snowpack, soil-moisture, and meteorological monitoring
      - 1 km VIC simulations across California (CWIS) with dynamic vegetation assimilation to quantify hydrologic impacts of wildfire and natural disturbance
      - Post-fire soil-erosion and sediment-yield modelling across California burn scars
  - title: Senior Research Fellow
    org: Indian Institute of Engineering Science and Technology, Shibpur
    start: 2015-01
    end: 2015-04
    details:
      - Radioactive-tracer experiments and hydrodynamic modelling of dredge-material dispersion in a coastal river reach

